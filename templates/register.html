{% extends 'base.html' %}{% block title %}Join — Cinephile{% endblock %}{% block content %}<section class="auth-layout"><div class="auth-art register-art"><span class="eyebrow">Join the community</span><h1>Make every watch count.</h1><p>Save discoveries, remember favorites, and leave thoughtful reviews.</p></div><div class="form-card"><h2>Create account</h2><p>Already a member? <a href="{{ url_for('login') }}">Sign in</a></p><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Username<input name="username" minlength="3" maxlength="24" pattern="[A-Za-z0-9_]+" autocomplete="username" required></label><label>Email<input type="email" name="email" autocomplete="email" required></label><label>Password<input type="password" name="password" minlength="8" autocomplete="new-password" required><small>8+ characters with a letter and number</small></label><button class="button wide" type="submit">Create account</button></form></div></section>{% endblock %}
