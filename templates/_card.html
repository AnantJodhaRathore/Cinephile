<article class="poster-card">
  <a href="{{ url_for('content_detail', content_id=item.id) }}"><img src="{{ item.poster }}" alt="Poster for {{ item.title }}" loading="lazy"><span class="rating">★ {{ item.rating }}</span><div class="card-gradient"></div></a>
  <div class="card-copy"><h3><a href="{{ url_for('content_detail', content_id=item.id) }}">{{ item.title }}</a></h3><p>{{ item.release_date[:4] }} · {{ item.genre_name }}</p></div>
</article>
